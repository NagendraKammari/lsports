name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the ARM runner: the Apple toolchain ships both
          # SDKs, and dedicated Intel macOS runners queue indefinitely.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="lsports-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" \
              "./target/${{ matrix.target }}/release/lsports.exe" \
              README.md LICENSE
          else
            staging="$(mktemp -d)/$name"
            mkdir -p "$staging"
            cp "target/${{ matrix.target }}/release/lsports" README.md LICENSE "$staging/"
            tar -czf "$name.tar.gz" -C "$(dirname "$staging")" "$name"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            lsports-*.tar.gz
            lsports-*.zip
          generate_release_notes: true
