name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - run: cargo test --locked

      # The binary inspects live sockets, so "it compiles" is a weak signal.
      # Exercise the real code paths against whatever the runner is listening on.
      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --help > /dev/null
          cargo run --locked --quiet -- --json | python3 -c 'import json,sys; json.load(sys.stdin)'
          cargo run --locked --quiet -- 65000 | grep -q "nothing is listening on port 65000"
          cargo run --locked --quiet -- --long > /dev/null

          # `free` on an idle port must succeed without prompting, so it is safe
          # to call unconditionally in a script. Nothing listens on 65000, so
          # this exercises the command without signalling anything.
          cargo run --locked --quiet -- free 65000 | grep -q "nothing to free"
          cargo run --locked --quiet -- free 65000 --dry-run > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: msrv (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
