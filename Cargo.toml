[package]
name = "lsports"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "See what's listening on your ports — and why it's there. Shows working directory, git branch, uptime and launch chain for every listener."
license = "MIT"
repository = "https://github.com/NagendraKammari/lsports"
homepage = "https://github.com/NagendraKammari/lsports"
readme = "README.md"
keywords = ["cli", "ports", "netstat", "lsof", "devtools"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/docs"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
netstat2 = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.36.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
